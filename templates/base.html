<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Pana Studio{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f8f8;
      color: #333;
      min-height: 100vh;
    }
    nav {
      background: #1a1a1a;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    nav .brand { color: #fff; font-weight: 700; font-size: 18px; text-decoration: none; }
    nav a { color: #ccc; text-decoration: none; font-size: 14px; }
    nav a:hover { color: #fff; }
    .container { max-width: 720px; margin: 40px auto; padding: 0 20px; }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }
    h1 { font-size: 22px; margin-bottom: 18px; }
    h2 { font-size: 18px; margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #555; }
    input, textarea, select {
      width: 100%; padding: 10px 12px; border: 1px solid #ddd;
      border-radius: 6px; font-size: 14px; font-family: inherit;
      margin-bottom: 16px;
    }
    textarea { resize: vertical; min-height: 100px; }
    .btn {
      display: inline-block; padding: 10px 22px; border-radius: 6px;
      font-size: 14px; font-weight: 600; cursor: pointer; border: none;
      text-decoration: none; margin-right: 8px; margin-bottom: 8px;
    }
    .btn-green  { background: #22c55e; color: #fff; }
    .btn-blue   { background: #3b82f6; color: #fff; }
    .btn-red    { background: #ef4444; color: #fff; }
    .btn-gray   { background: #6b7280; color: #fff; }
    .message-box {
      background: #f5f5f5; border-left: 4px solid #999;
      padding: 14px; border-radius: 4px; margin-bottom: 16px;
      font-size: 15px; white-space: pre-wrap; line-height: 1.6;
    }
    .message-box.ai { background: #f0fdf4; border-color: #22c55e; }
    .alert-success {
      background: #f0fdf4; border: 1px solid #86efac; padding: 12px 16px;
      border-radius: 6px; color: #166534; margin-bottom: 16px;
    }
    .checkboxes { display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }
    .checkboxes label { font-weight: 400; display: flex; align-items: center; gap: 6px; }
    .checkboxes input { width: auto; margin: 0; }
  </style>
</head>
<body>
<nav>
  <a class="brand" href="/">📸 Pana Studio</a>
  <a href="/leads">Leads</a>
  <a href="/post">โพสต์ใหม่</a>
  <a href="/calendar">Calendar</a>
  <a href="/skills">Skills</a>
  <a href="/announce">Announce</a>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
